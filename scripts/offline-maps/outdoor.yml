schema_name: StepSplit outdoor extras
schema_description: Tracks, paths, minor roads and wadis from z9-z11 (OpenMapTiles has them only from z11-z14), and outdoor points (camp sites, springs, water, viewpoints, caves, picnic spots, ruins) from z11-z13
attribution: <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>
args:
  osm_path: work/region.osm.pbf
  maxzoom: 13
sources:
  osm:
    type: osm
    local_path: '${ args.osm_path }'
definitions:
  merge: &merge
    merge_line_strings:
      min_length: 3
      tolerance: 0.5
      min_length_at_max_zoom: 0
      tolerance_at_max_zoom: 0.125
layers:
  - id: outdoor_transportation
    features:
      - source: osm
        geometry: line
        include_when:
          highway: [tertiary, tertiary_link, unclassified, track, path, bridleway]
        exclude_when:
          area: "yes"
          tunnel: ["yes", building_passage]
          footway: sidewalk
        min_zoom:
          default_value: 11
          overrides:
            9: { highway: [tertiary, tertiary_link] }
            10: { highway: [unclassified, track] }
        attributes:
          - key: class
            value:
              tertiary: { highway: [tertiary, tertiary_link] }
              minor: { highway: unclassified }
              track: { highway: track }
              path: otherwise
          - key: subclass
            type: match_value
          - key: surface
            value:
              - if:
                  surface: [paved, asphalt, cobblestone, concrete, "concrete:lanes", "concrete:plates", metal, paving_stones, sett, unhewn_cobblestone, wood]
                value: paved
              - if:
                  surface: [unpaved, compacted, dirt, earth, fine_gravel, grass, grass_paver, gravel, gravel_turf, ground, ice, mud, pebblestone, salt, sand, snow, woodchips, rock]
                value: unpaved
              - if:
                  tracktype: grade1
                value: paved
              - if:
                  tracktype: [grade2, grade3, grade4, grade5]
                value: unpaved
          - key: brunnel
            value:
              - if: { bridge: ["yes", viaduct] }
                value: bridge
              - if: { ford: "yes" }
                value: ford
    tile_post_process: *merge
  - id: outdoor_waterway
    features:
      - source: osm
        geometry: line
        include_when:
          waterway: [river, stream, canal, wadi]
        exclude_when:
          tunnel: ["yes", culvert]
        min_zoom:
          default_value: 10
          overrides:
            9: { waterway: river }
        attributes:
          - key: class
            value:
              stream: { waterway: [stream, wadi] }
              river: { waterway: river }
              canal: otherwise
          - key: intermittent
            type: integer
            value:
              - if:
                  intermittent: "yes"
                  seasonal: "yes"
                  waterway: wadi
                value: 1
              - else: 0
          - key: name
            tag_value: name
            min_zoom: 12
          - key: name:en
            tag_value: name:en
            min_zoom: 12
          - key: name:he
            tag_value: name:he
            min_zoom: 12
    tile_post_process:
      merge_line_strings:
        min_length: 6
        tolerance: 0.5
        min_length_at_max_zoom: 0
        tolerance_at_max_zoom: 0.125
  # Outdoor points from z11-z13, with OpenMapTiles' poi attributes; OpenMapTiles has POIs only from
  # z14, and springs, caves, archaeological sites, water taps and picnic tables not at all. Its own
  # classes (campsite, attraction, castle, picnic_site, drinking_water) let the style's outdoor POI
  # icons draw them; the rest keep their tag value as class. Camp sites and named springs show from
  # z11, other named points from z12, all from z13; rank orders them when labels collide.
  - id: outdoor_poi
    features:
      - source: osm
        geometry: point
        include_when: &outdoor_poi
          tourism: [camp_site, viewpoint, picnic_site]
          natural: [spring, cave_entrance]
          historic: [ruins, archaeological_site]
          amenity: drinking_water
          man_made: water_tap
          leisure: picnic_table
        min_zoom: &outdoor_poi_min_zoom '${ feature.tags.has("tourism", "camp_site") || feature.tags.has("natural", "spring") && feature.tags.has("name") ? 11 : feature.tags.has("name") ? 12 : 13 }'
        attributes: &poi_attributes
          - key: class
            value:
              campsite: { tourism: camp_site }
              spring: { natural: spring }
              drinking_water: { amenity: drinking_water }
              water_tap: { man_made: water_tap }
              attraction: { tourism: viewpoint }
              cave_entrance: { natural: cave_entrance }
              picnic_site: { tourism: picnic_site }
              picnic_table: { leisure: picnic_table }
              castle: { historic: ruins }
              archaeological_site: { historic: archaeological_site }
          - key: subclass
            value:
              camp_site: { tourism: camp_site }
              spring: { natural: spring }
              drinking_water: { amenity: drinking_water }
              water_tap: { man_made: water_tap }
              viewpoint: { tourism: viewpoint }
              cave_entrance: { natural: cave_entrance }
              picnic_site: { tourism: picnic_site }
              picnic_table: { leisure: picnic_table }
              ruins: { historic: ruins }
              archaeological_site: { historic: archaeological_site }
          - key: rank
            type: integer
            value:
              - if: { tourism: camp_site }
                value: 1
              - if: { natural: spring }
                value: 2
              - if: { amenity: drinking_water, man_made: water_tap }
                value: 3
              - if: { tourism: viewpoint }
                value: 4
              - if: { natural: cave_entrance }
                value: 5
              - if: { tourism: picnic_site, leisure: picnic_table }
                value: 6
              - else: 7
          - key: name
            tag_value: name
            min_zoom: 12
          - key: name:en
            tag_value: name:en
            min_zoom: 12
          - key: name:he
            tag_value: name:he
            min_zoom: 12
      - source: osm
        geometry: polygon_point_on_surface
        include_when: *outdoor_poi
        min_zoom: *outdoor_poi_min_zoom
        attributes: *poi_attributes
